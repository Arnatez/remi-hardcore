<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remi Hardcore - Online Firebase Edition v5.0</title>
    <!-- Font TT Runs / Montserrat / Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK (COMPAT VERSION FOR EASY INTEGRATION) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #030712; color: #f3f4f6; text-align: center; margin: 0; padding: 12px; }
        .glass-panel { background: rgba(10, 20, 35, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7); }
        .neon-title { font-size: 28px; font-weight: 900; color: #ffffff; text-shadow: 0 0 10px #00f3ff; }
        button { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; padding: 10px 16px; margin: 4px; border-radius: 8px; border: 1px solid rgba(0, 243, 255, 0.4); cursor: pointer; background: #0f172a; color: #fff; }
        button:hover { border-color: #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .btn-google { background: linear-gradient(135deg, #ea4335, #c5221f); border-color: #f87171; }
        .btn-gm { background: linear-gradient(135deg, #9333ea, #7e22ce); border-color: #c084fc; }
        .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { padding: 22px; border-radius: 18px; width: 450px; max-width: 90vw; text-align: center; }
        .exp-bar-bg { background: rgba(0,0,0,0.6); height: 10px; border-radius: 5px; border: 1px solid #00f3ff; overflow: hidden; margin-top: 8px; }
        .exp-bar-fill { background: linear-gradient(90deg, #00f3ff, #3b82f6); height: 100%; width: 0%; transition: width 0.3s ease; }
    </style>
</head>
<body>

<!-- MODAL SYSTEM LOGIN -->
<div id="modal-login" class="modal" style="display: flex;">
    <div class="modal-content glass-panel">
        <div class="neon-title" style="font-size: 22px;">🔑 REMI HARDCORE</div>
        <p style="font-size: 12px; color: #38bdf8;">PILIH METODE MASUK GAME</p>
        
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
            <button class="btn-google" onclick="loginWithGoogle()" style="padding: 12px; font-size: 12px;">🌐 LOGIN DENGAN GOOGLE (PLAYER)</button>
            <hr style="border-color: rgba(0, 243, 255, 0.2); width: 100%;">
            <button class="btn-gm" onclick="loginAsDeveloper()" style="padding: 12px; font-size: 12px;">👑 MASUK SEBAGAI DEVELOPER (GM)</button>
        </div>
    </div>
</div>

<!-- HOME SCREEN -->
<div id="home-screen" class="glass-panel" style="max-width: 600px; margin: 20px auto; padding: 20px; border-radius: 16px; display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button onclick="logout()" style="background: #e11d48;">🚪 Logout</button>
        <button id="btn-gm-tools" class="btn-gm" onclick="openGmModal()" style="display: none;">👑 DEV CONSOLE</button>
    </div>

    <div class="neon-title" style="margin-top: 10px;">♣ DASHBOARD GAME ♠</div>

    <div style="margin: 20px 0; padding: 15px; border-radius: 12px; background: rgba(15, 23, 42, 0.8);">
        <h3 id="user-name-display" style="color: #00f3ff; margin: 0;">-</h3>
        <div style="font-size: 13px; margin-top: 5px;">
            Level: <b id="user-level-text">1</b> | Coins: <b id="user-coin-text" style="color: #00f3ff;">0</b>
        </div>
        <div class="exp-bar-bg"><div id="user-exp-fill" class="exp-bar-fill"></div></div>
        <div id="user-exp-text" style="font-size: 11px; margin-top: 4px; color: #aaa;">0 / 100 EXP</div>
    </div>

    <button class="btn-green" style="width: 100%; padding: 12px; font-size: 14px;">🎮 MULAI MAIN VS BOT</button>
</div>

<!-- MODAL GM CONSOLE MONITORING -->
<div id="modal-gm" class="modal">
    <div class="modal-content glass-panel">
        <h3 style="color: #c084fc; margin-top: 0;">👑 GAME MASTER CONSOLE</h3>
        <p style="font-size: 11px; color: #aaa;">Ubah data profil & sync otomatis ke Realtime Database</p>
        
        <div style="background: rgba(15,23,42,0.8); border: 1px solid #c084fc; padding: 12px; border-radius: 10px; margin: 15px 0;">
            <div style="color: #c084fc; font-weight: bold; margin-bottom: 8px; font-size: 13px;">⭐ SET LEVEL AKUN INI:</div>
            <input type="range" id="gm-level-slider" min="1" max="100" value="1" oninput="document.getElementById('gm-lvl-val').innerText = this.value" style="width: 100%;">
            <div>Level: <b id="gm-lvl-val" style="color: #00f3ff;">1</b></div>
            <button class="btn-green" onclick="gmApplyLevel()" style="margin-top: 8px;">SIMPAN LEVEL</button>
        </div>

        <button class="btn-gm" onclick="gmAddCoins()" style="width: 100%;">💰 KIRIM +100.000 GOLD</button>
        <button onclick="closeGmModal()" style="margin-top: 15px;">Tutup Console</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. KONFIGURASI FIREBASE AKUN KAMU
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyD8fRzy1PHqbypdQ6sFQJ88bvsDONzNAmk",
        authDomain: "remi-hardcore.firebaseapp.com",
        databaseURL: "https://remi-hardcore-default-rtdb.firebaseio.com",
        projectId: "remi-hardcore",
        storageBucket: "remi-hardcore.appspot.com",
        messagingSenderId: "1234567890", // Nanti menyesuaikan otomatis dari firebase
        appId: "1:1234567890:web:abcdef" // Nanti menyesuaikan otomatis dari firebase
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let userProfile = { name: "", level: 1, exp: 100, coins: 0, isGm: false };

    function getRequiredExp(lvl) {
        if (lvl <= 1) return 100;
        if (lvl >= 100) return 100000;
        return Math.round(100 + Math.pow(lvl - 1, 1.5) * 100);
    }

    // ==========================================
    // 2. AUTHENTICATION (GOOGLE & GM)
    // ==========================================
    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => alert("Login Gagal: " + error.message));
    }

    function loginAsDeveloper() {
        const pass = prompt("Masukkan Password GM / Developer:");
        if (pass === "gm123") {
            currentUser = { uid: "gm_dev_account" };
            userProfile = { name: "Developer GM 👑", level: 100, exp: 100000, coins: 999999, isGm: true };
            syncUI();
            document.getElementById('modal-login').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
        } else {
            alert("Password GM Salah!");
        }
    }

    function logout() {
        auth.signOut().then(() => {
            currentUser = null;
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('modal-login').style.display = 'flex';
        });
    }

    // Monitor Status Login Player
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('modal-login').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';

            db.ref('users/' + user.uid).on('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    userProfile = data;
                } else {
                    userProfile = {
                        name: user.displayName || "Player",
                        level: 1,
                        exp: 0,
                        coins: 1000,
                        isGm: false
                    };
                    db.ref('users/' + user.uid).set(userProfile);
                }
                syncUI();
            });
        }
    });

    function saveProfileToDatabase() {
        if (currentUser && currentUser.uid !== "gm_dev_account") {
            db.ref('users/' + currentUser.uid).set(userProfile);
        } else {
            syncUI();
        }
    }

    function syncUI() {
        document.getElementById('user-name-display').innerText = userProfile.name;
        document.getElementById('user-level-text').innerText = userProfile.level;
        document.getElementById('user-coin-text').innerText = userProfile.coins.toLocaleString();
        
        const reqExp = getRequiredExp(userProfile.level);
        document.getElementById('user-exp-fill').style.width = Math.min(100, (userProfile.exp / reqExp) * 100) + "%";
        document.getElementById('user-exp-text').innerText = `${userProfile.exp.toLocaleString()} / ${reqExp.toLocaleString()} EXP`;

        document.getElementById('btn-gm-tools').style.display = userProfile.isGm ? 'block' : 'none';
    }

    // ==========================================
    // 3. DEV TOOLS / GM ACTIONS
    // ==========================================
    function openGmModal() { document.getElementById('modal-gm').style.display = 'flex'; }
    function closeGmModal() { document.getElementById('modal-gm').style.display = 'none'; }

    function gmApplyLevel() {
        const lvl = parseInt(document.getElementById('gm-level-slider').value);
        userProfile.level = lvl;
        userProfile.exp = getRequiredExp(lvl);
        saveProfileToDatabase();
        alert(`⭐ Level berhasil diubah ke ${lvl}!`);
    }

    function gmAddCoins() {
        userProfile.coins += 100000;
        saveProfileToDatabase();
    }
</script>
</body>
</html>
